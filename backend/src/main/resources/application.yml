server:
  port: ${CITYMAP_PORT:8088}

spring:
  application:
    name: citymap
  datasource:
    url: jdbc:sqlite:${CITYMAP_DB:./citymap.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # SQLite is not officially supported by Flyway community edition without a shim,
    # so we disable it and use manual schema init below. Toggle to true if using Flyway Enterprise.
    # (Overridden by CityMapApplication.SchemaInitializer.)

citymap:
  cors:
    origins: http://localhost:5173,http://localhost:4173

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: INFO
    com.citymap: DEBUG
