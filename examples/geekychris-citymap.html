<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>geekychris projects — CityMap export</title>
  <style>
:root {
  color-scheme: dark;
  --panel: #0b1220;
  --panel2: #111a2e;
  --card: #151f36;
  --line: #1e2a44;
  --ink: #e2e8f0;
  --subink: #94a3b8;
  --accent: #38bdf8;
  --accent2: #a78bfa;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(at 20% 0%, #0b1220 0%, #05080f 65%);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, "Segoe UI",
               Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  height: 48px; min-height: 48px;
  border-bottom: 1px solid var(--line);
  background: rgba(11, 18, 32, 0.85);
  backdrop-filter: blur(6px);
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark {
  width: 14px; height: 14px; border-radius: 4px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
}
.brand-name { font-weight: 700; font-size: 15px; }
.brand-sub  { font-weight: 400; font-size: 12px; color: var(--subink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.controls { display: flex; align-items: center; gap: 8px; }
.controls input#search {
  background: var(--panel2);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  width: 220px;
}
.controls input#search:focus { outline: none; border-color: var(--accent); }
.btn {
  background: rgba(148, 163, 184, 0.12);
  color: var(--ink);
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.btn:hover { background: rgba(148, 163, 184, 0.22); }
.btn.off { opacity: 0.55; }

#stage { flex: 1; display: flex; overflow: hidden; }
#viewport {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: grab;
  background:
    radial-gradient(circle at 30% 40%, rgba(56, 189, 248, 0.05), transparent 60%),
    radial-gradient(circle at 70% 60%, rgba(167, 139, 250, 0.05), transparent 60%);
}
#viewport.dragging { cursor: grabbing; }
#world {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}
#edges {
  position: absolute; top: 0; left: 0;
  overflow: visible;
  pointer-events: none;
}
#nodes { position: relative; }
#crumb {
  position: absolute; top: 12px; left: 12px;
  padding: 6px 10px;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12px;
  color: var(--subink);
  display: none;
}
#crumb .up,
#crumb .sib-prev,
#crumb .sib-next {
  color: var(--accent);
  cursor: pointer;
  margin-right: 8px;
}
#crumb .up:hover,
#crumb .sib-prev:hover,
#crumb .sib-next:hover { text-decoration: underline; }
#crumb .sib-prev[data-off], #crumb .sib-next[data-off] {
  color: var(--subink);
  cursor: default;
  opacity: 0.5;
  text-decoration: none !important;
}
#crumb .sib-idx {
  color: var(--subink);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  margin-right: 8px;
}
#hint {
  position: absolute; bottom: 12px; left: 12px;
  padding: 6px 10px;
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 11px;
  color: var(--subink);
  pointer-events: none;
}

.node {
  position: absolute;
  border-radius: 14px;
  border: 1px solid rgba(148, 163, 184, 0.35);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  overflow: hidden;
  color: rgba(255, 255, 255, 0.94);
  transition: box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  cursor: pointer;
}
.node.dim { opacity: 0.25; }
.node.selected {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  box-shadow: 0 6px 32px rgba(56, 189, 248, 0.35);
}
.node .head {
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
}
.node .head .title {
  flex: 1 1 0%; min-width: 0;
  font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.10);
  color: rgba(255, 255, 255, 0.85);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 10px;
  flex-shrink: 0;
}
.node .body { padding: 6px 10px; overflow: hidden; }
.node .desc {
  font-size: 12px; line-height: 1.4;
  color: rgba(226, 232, 240, 0.88);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.node .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px;
  background: rgba(148, 163, 184, 0.15);
  color: #cbd5e1;
  padding: 2px 7px;
  border-radius: 999px;
}
.node .repo-link {
  display: inline-block; margin-top: 4px;
  color: var(--accent);
  font-size: 11px;
  text-decoration: underline;
}
.node .repo-link:hover { color: #7dd3fc; }
/* per-level typography — mirrors ComponentNode.HEADER_STYLE from the app */
.level-0 .head { padding: 16px 22px; }
.level-0 .head .title { font-size: 48px; font-weight: 700; }
.level-0 .head .badge { font-size: 14px; padding: 3px 10px; }
.level-1 .head { padding: 12px 18px; }
.level-1 .head .title { font-size: 30px; font-weight: 700; }
.level-1 .head .badge { font-size: 12px; padding: 3px 8px; }
.level-2 .head { padding: 8px 14px; }
.level-2 .head .title { font-size: 20px; font-weight: 600; }
.level-2 .head .badge { font-size: 10px; padding: 2px 6px; }
.level-3 .head { padding: 6px 10px; }
.level-3 .head .title { font-size: 13px; font-weight: 600; }
.level-3 .head .badge { display: none; }
.level-4 .head { padding: 5px 8px; }
.level-4 .head .title { font-size: 12px; font-weight: 600; }
.level-4 .head .badge { display: none; }

#panel {
  width: 380px; min-width: 380px;
  border-left: 1px solid var(--line);
  background: rgba(11, 18, 32, 0.85);
  padding: 12px 16px;
  overflow-y: auto;
}
#panel-empty { color: var(--subink); font-size: 13px; padding-top: 20px; text-align: center; }
#panel-content h2 {
  font-size: 15px; margin: 0 0 6px 0;
  display: flex; align-items: center; gap: 8px;
}
#panel-content .path { color: var(--subink); font-size: 11px; margin-bottom: 8px; }
#panel-content .row { margin: 10px 0; }
#panel-content .label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--subink); margin-bottom: 4px;
}
#panel-content .value { font-size: 13px; color: var(--ink); line-height: 1.4; }
#panel-content pre {
  background: var(--panel2); border: 1px solid var(--line);
  padding: 8px; border-radius: 6px; overflow: auto; font-size: 11px;
  max-height: 280px;
}
#panel-content a { color: var(--accent); }
#panel-content .notes {
  background: var(--panel2); border: 1px solid var(--line);
  padding: 8px 10px; border-radius: 6px; font-size: 12px;
  white-space: pre-wrap; word-break: break-word;
  max-height: 200px; overflow-y: auto;
}

/* SVG edges */
#edges line { pointer-events: stroke; cursor: pointer; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.25);
  border-radius: 10px;
  border: 2px solid transparent;
  background-clip: padding-box;
}

/* Mode toggle */
.mode-toggle {
  display: inline-flex; align-items: stretch;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin-right: 4px;
}
.mode-toggle button {
  background: transparent;
  color: var(--subink);
  border: 0;
  padding: 6px 10px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.mode-toggle button:hover { color: var(--ink); background: rgba(255,255,255,.05); }
.mode-toggle button.active { color: var(--accent); background: rgba(56,189,248,.15); }

/* ---------- Blueprint mode ------------------------------------------------ */
body[data-mode="blueprint"] {
  background: #0d3b7a;
  color: #eaf2ff;
}
body[data-mode="blueprint"] #topbar {
  background: rgba(9, 34, 71, 0.85);
  border-bottom-color: rgba(255,255,255,.35);
}
body[data-mode="blueprint"] .brand-name,
body[data-mode="blueprint"] .brand-sub { color: #eaf2ff; }
body[data-mode="blueprint"] .brand-mark {
  background: #cffafe; box-shadow: none;
}
body[data-mode="blueprint"] .btn,
body[data-mode="blueprint"] .controls input#search {
  background: rgba(255,255,255,.08);
  color: #eaf2ff;
  border-color: rgba(255,255,255,.4);
}
body[data-mode="blueprint"] .btn:hover { background: rgba(255,255,255,.16); }
body[data-mode="blueprint"] .mode-toggle { border-color: rgba(255,255,255,.35); }
body[data-mode="blueprint"] .mode-toggle button { color: rgba(234,242,255,.7); }
body[data-mode="blueprint"] .mode-toggle button.active { color: #67e8f9; background: rgba(103,232,249,.15); }
body[data-mode="blueprint"] #viewport {
  background:
    linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 40px 40px,
    #0d3b7a;
}
body[data-mode="blueprint"] .node {
  background: rgba(255,255,255,.04) !important;
  border: 1px solid rgba(255,255,255,.6);
  border-radius: 4px;
  box-shadow: none;
  color: #eaf2ff;
}
body[data-mode="blueprint"] .node.selected {
  outline-color: #67e8f9;
}
body[data-mode="blueprint"] .node .head {
  background: rgba(255,255,255,.08);
  border-bottom-color: rgba(255,255,255,.45);
  color: #ffffff;
}
body[data-mode="blueprint"] .node .body,
body[data-mode="blueprint"] .node .body *,
body[data-mode="blueprint"] .node .desc {
  color: #eaf2ff;
}
body[data-mode="blueprint"] .node .repo-link { color: #67e8f9; }
body[data-mode="blueprint"] .badge {
  background: transparent;
  border: 1px solid rgba(255,255,255,.55);
  color: #eaf2ff;
}
body[data-mode="blueprint"] .chip {
  background: transparent;
  border: 1px solid rgba(255,255,255,.45);
  color: #eaf2ff;
}
body[data-mode="blueprint"] #panel {
  background: rgba(9, 34, 71, 0.85);
  border-left-color: rgba(255,255,255,.35);
}
body[data-mode="blueprint"] #panel-content pre,
body[data-mode="blueprint"] #panel-content .notes {
  background: rgba(255,255,255,.06);
  border-color: rgba(255,255,255,.35);
  color: #eaf2ff;
}
body[data-mode="blueprint"] #crumb,
body[data-mode="blueprint"] #hint {
  background: rgba(9,34,71,.85);
  border-color: rgba(255,255,255,.35);
  color: #cffafe;
}

/* ---------- Wireframe mode ------------------------------------------------ */
body[data-mode="wireframe"] {
  background: #ffffff;
  color: #111827;
}
body[data-mode="wireframe"] #topbar {
  background: #ffffff;
  border-bottom-color: #111827;
  color: #111827;
}
body[data-mode="wireframe"] .brand-name,
body[data-mode="wireframe"] .brand-sub { color: #111827; }
body[data-mode="wireframe"] .brand-mark {
  background: #111827; box-shadow: none;
}
body[data-mode="wireframe"] .btn,
body[data-mode="wireframe"] .controls input#search {
  background: #ffffff;
  color: #111827;
  border-color: #111827;
}
body[data-mode="wireframe"] .btn:hover { background: #f4f4f4; }
body[data-mode="wireframe"] .mode-toggle { border-color: #111827; }
body[data-mode="wireframe"] .mode-toggle button { color: #4b5563; }
body[data-mode="wireframe"] .mode-toggle button.active { color: #111827; background: #f4f4f4; }
body[data-mode="wireframe"] #viewport {
  background: #ffffff;
  background-image:
    radial-gradient(#d1d5db 1px, transparent 1px);
  background-size: 16px 16px;
}
body[data-mode="wireframe"] .node {
  background: #ffffff !important;
  border: 1.25px solid #111827;
  border-radius: 3px;
  box-shadow: none;
  color: #111827;
}
body[data-mode="wireframe"] .node.selected {
  outline-color: #111827;
  box-shadow: none;
}
body[data-mode="wireframe"] .node .head {
  background: #f4f4f4;
  border-bottom-color: #111827;
  color: #111827;
}
body[data-mode="wireframe"] .node .body,
body[data-mode="wireframe"] .node .body *,
body[data-mode="wireframe"] .node .desc {
  color: #111827;
}
body[data-mode="wireframe"] .node .repo-link {
  color: #111827;
  text-decoration: underline;
}
body[data-mode="wireframe"] .badge {
  background: transparent;
  border: 1px solid #111827;
  color: #111827;
}
body[data-mode="wireframe"] .chip {
  background: transparent;
  border: 1px solid #4b5563;
  color: #111827;
}
body[data-mode="wireframe"] #panel {
  background: #ffffff;
  border-left-color: #111827;
  color: #111827;
}
body[data-mode="wireframe"] #panel-content pre,
body[data-mode="wireframe"] #panel-content .notes {
  background: #f4f4f4;
  border-color: #d1d5db;
  color: #111827;
}
body[data-mode="wireframe"] #crumb,
body[data-mode="wireframe"] #hint {
  background: #ffffff;
  border-color: #111827;
  color: #111827;
}

/* ---------- Tile print (screen + print) ---------------------------------- */
/* Hidden by default. Populated by buildTiles() when the user prints with
   Pages ≥ 1, and torn down again after the browser fires afterprint. */
#print-sheet { display: none; }
.print-pages-label { display: inline-flex; align-items: center; }
.print-pages-label select {
  background: var(--panel2);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
  font-family: inherit;
}
body[data-mode="wireframe"] .print-pages-label select {
  background: #ffffff; color: #111827; border-color: #111827;
}
body[data-mode="blueprint"] .print-pages-label select {
  background: rgba(255,255,255,.08); color: #eaf2ff; border-color: rgba(255,255,255,.4);
}

.print-tile {
  width: 263mm;   /* letter landscape (279.4mm) minus 8mm margins each side */
  height: 199mm;  /* letter landscape (215.9mm) minus 8mm margins each side */
  overflow: hidden;
  position: relative;
  page-break-after: always;
  break-after: page;
  outline: 0.2mm dashed #9ca3af;
  outline-offset: -0.2mm;
  background: #ffffff;
}
.print-tile:last-child { page-break-after: auto; break-after: auto; }
body[data-mode="blueprint"] .print-tile {
  background:
    linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 40px 40px,
    #0d3b7a;
  outline-color: rgba(255,255,255,.4);
}
body[data-mode="wireframe"] .print-tile { background: #ffffff; outline-color: #4b5563; }

.tile-label {
  position: absolute;
  bottom: 3mm;
  right: 5mm;
  font-size: 3.5mm;
  color: rgba(0,0,0,0.6);
  background: rgba(255,255,255,0.92);
  padding: 1mm 3mm;
  border-radius: 1mm;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  z-index: 999;
}
body[data-mode="blueprint"] .tile-label {
  color: #eaf2ff;
  background: rgba(9,34,71,0.92);
}

/* Per-page (L1/L2) print — each subtree gets a header strip at the top of its
   sheet plus its fit-to-page world clone below. */
.per-page-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 12mm;
  padding: 2.5mm 5mm;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.8mm;
  background: #ffffff;
  border-bottom: 0.15mm solid #d1d5db;
  z-index: 500;
  color: #111827;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.per-page-header .pp-title {
  font-size: 12pt; font-weight: 700;
  display: flex; align-items: baseline; gap: 2mm;
}
.per-page-header .pp-badge {
  font-size: 7pt; text-transform: uppercase; letter-spacing: 0.06em;
  border: 0.15mm solid #9ca3af; color: #4b5563;
  padding: 0.4mm 1.5mm; border-radius: 0.5mm;
  font-weight: 500;
}
.per-page-header .pp-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 8pt; color: #6b7280;
}
.per-page-header .pp-idx {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #4b5563;
}
body[data-mode="blueprint"] .per-page-header {
  background: rgba(9,34,71,0.95);
  border-bottom-color: rgba(255,255,255,0.4);
  color: #eaf2ff;
}
body[data-mode="blueprint"] .per-page-header .pp-badge { color: #cffafe; border-color: rgba(255,255,255,0.4); }
body[data-mode="blueprint"] .per-page-header .pp-meta,
body[data-mode="blueprint"] .per-page-header .pp-idx { color: #cffafe; }

/* ---------- Outline view + print ---------------------------------------- */
/* A text-first, layout-independent rendering of the map. Shown on screen when
   body.outlining is active AND during print — so you can preview it, adjust,
   and re-print without leaving the page. */
#print-outline { display: none; }
body.outlining > *:not(#print-outline) { display: none !important; }
body.outlining {
  background: #ffffff !important;
  color: #111827 !important;
  overflow: auto !important;
}
body.outlining #print-outline {
  display: block !important;
  background: #ffffff;
  min-height: 100vh;
  padding: 18mm 15mm;
  max-width: 220mm;
  margin: 0 auto;
  box-sizing: border-box;
}
@media print {
  body.outlining #print-outline {
    padding: 0;
    max-width: none;
    min-height: 0;
    margin: 0;
  }
  body.outlining { overflow: visible !important; }
}

/* Floating toolbar attached to the outline view — only visible on screen. */
.outline-toolbar {
  position: fixed;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  background: #ffffff;
  padding: 6px 8px;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  z-index: 1000;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
}
.outline-toolbar button, .outline-toolbar select {
  background: #ffffff;
  border: 1px solid #d1d5db;
  color: #111827;
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
}
.outline-toolbar button:hover { background: #f3f4f6; }
.outline-toolbar .primary {
  background: #0284c7;
  border-color: #0369a1;
  color: #ffffff;
}
.outline-toolbar .primary:hover { background: #0369a1; }
.outline-toolbar label { color: #4b5563; font-size: 12px; }
@media print { .outline-toolbar { display: none !important; } }
.outline-cover {
  text-align: center;
  padding: 55mm 10mm 15mm;
  border-bottom: 0.4mm solid #111827;
  margin-bottom: 12mm;
  break-after: page;
}
.outline-cover h1 {
  font-size: 26pt; margin: 0 0 4mm; letter-spacing: -0.01em;
  color: #111827;
}
.outline-cover .cover-sub {
  font-size: 11pt; color: #4b5563; font-weight: 500;
}
.outline-cover .cover-gen {
  font-size: 9pt; color: #6b7280; margin-top: 2mm; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.outline-body {
  column-count: 2;
  column-gap: 8mm;
  column-fill: auto;
  color: #111827;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 9.5pt;
  line-height: 1.4;
}
.outline-entry {
  break-inside: avoid-column;
  page-break-inside: avoid;
  margin: 0 0 3mm;
  padding: 1.5mm 2mm 1.5mm 3mm;
  border-left: 0.3mm solid #d1d5db;
}
.city-block { break-inside: auto; }
.city-block + .city-block { break-before: page; }
.outline-entry.level-0 {
  border-left: 0;
  border-top: 0.5mm solid #111827;
  padding: 4mm 0 3mm;
  margin: 0 0 4mm;
}

  #stage, #viewport { overflow: visible !important; height: auto !important; }
  body[data-mode="blueprint"] #viewport,
  body[data-mode="wireframe"] #viewport {
    -webkit-print-color-adjust: exact;

  }
  body[data-mode="city"] {
    background: #ffffff !important;
    color: #111827 !important;
  }
  body[data-mode="city"] .node {
    background: #ffffff !important;
    border: 1px solid #111827 !important;
    color: #111827 !important;

  }
  body[data-mode="city"] .node .head {
    background: #f4f4f4 !important;
    color: #111827 !important;
    border-bottom-color: #111827 !important;
  }

  /* Tile-print branch — body.tiling is added by buildTiles() before print. */
  body.tiling > *:not(#print-sheet) { display: none !important; }
  body.tiling > #print-sheet { display: block !important; }
  body.tiling { background: #ffffff !important; }
  body.tiling.tiling-blueprint { background: #0d3b7a !important; }
  #print-sheet, #print-sheet * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  /* When tiling, no default @page margin — tiles are already sized for a
     letter landscape page with 8mm safety margins baked in. */
  @page { size: letter landscape; margin: 8mm; }

  /* Outline-print branch — body.outlining is added by buildOutline(). */
  body.outlining > *:not(#print-outline) { display: none !important; }
  body.outlining > #print-outline { display: block !important; }
  body.outlining {
    background: #ffffff !important;
    color: #111827 !important;
  }
  body.outlining, body.outlining * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}
/* Outline print prefers portrait letter — the two-column layout there gives
   about 90mm per column, comfortable for body-copy typography. Named @page
   so it only applies when #print-outline is actually rendered. */
@page outline-page { size: letter portrait; margin: 15mm 12mm 18mm; }
@media print {
  body.outlining #print-outline { page: outline-page; }

ba1","description":"Agent identity:: The workload identity of the agent process itself, with its own credentials, audit trail, and policy attachment. Distinct from the identity of the human whose intent the agent is executing.","metadata":{},"createdAt":"2026-09-12T03:45:39.425400Z","updatedAt":"2026-09-12T05:07:44.084607Z"},{"id":"109b587b-5c3a-43d0-87fe-315d4918f1c9","parentId":"a4d39146-bb42-402c-8aaa-dcba3ac61a3b","name":"Integration with the orchestration platform — details","type":"BUILDING","level":3,"x":18,"y":44,"width":300,"height":180,"color":"#a94464","description":"Ambient agents use the same platform primitives as reactive agents. This section names how each primitive is applied under the ambient trigger model.","metadata":{},"createdAt":"2026-09-12T03:45:39.724460Z","updatedAt":"2026-09-12T05:07:44.085510Z"},{"id":"aa782829-3234-4d82-92cc-125f49e6fbd7","parentId":"647136af-4dbd-4119-9ebb-3ec5946b4dde","name":"Intelligent investigation and contextualization","type":"BUILDING","level":3,"x":666,"y":656,"width":300,"height":180,"color":"#3b7dd8","description":"Natural language can remove query-language friction: an engineer asks for checkout-service 5xx errors over the last two hours, and the system generates and explains the corresponding Splunk or Datadog query. The deeper v...","metadata":{},"createdAt":"2026-09-12T03:45:39.529056Z","updatedAt":"2026-09-12T05:07:44.086508Z"},{"id":"ebfc4b46-1a72-4ead-a7ce-65918ca3a872","parentId":"647136af-4dbd-4119-9ebb-3ec5946b4dde","name":"Knowledge management and shift handover","type":"BUILDING","level":3,"x":18,"y":860,"width":300,"height":180,"color":"#3b7dd8","description":"Operational knowledge is fragmented across runbooks, incident records, Slack discussions, ticket histories, command traces, dashboards, and individual memory. AI can assemble a provisional runbook during a novel incident...","metadata":{},"createdAt":"2026-09-12T03:45:39.530044Z","updatedAt":"2026-09-12T05:07:44.087420Z"},{"id":"434319c1-137f-47a2-aab3-2fadc42c8dc6","parentId":"f6895ef1-54ef-4c5c-8abe-8c2e9ff700de","name":"MCP and REST change the agent inner loop","type":"BUILDING","level":3,"x":18,"y":656,"width":300,"height":180,"color":"#0891b2","description":"The largest developer-experience effect is not the protocol itself. It is the longer inner loop that becomes possible when an agent can reach the systems surrounding the code. Without tools, the agent produces a suggesti...","metadata":{},"createdAt":"2026-09-12T03:45:39.570337Z","updatedAt":"2026-09-12T05:07:44.088336Z"},{"id":"fd81a85d-6acc-4354-a2a8-18c01519db7d","parentId":"f6895ef1-54ef-4c5c-8abe-8c2e9ff700de","name":"MCP gateways as part of this ecosystem","type":"BUILDING","level":3,"x":666,"y":452,"width":300,"height":180,"color":"#0891b2","description":"If engineers use MCP services to reach internal tools and data, those connections need the same kind of governance expected elsewhere in the enterprise ecosystem. Direct agent-to-server connections can otherwise create a...","metadata":{},"createdAt":"2026-09-12T03:45:39.569156Z","updatedAt":"2026-09-12T05:07:44.089177Z"},{"id":"a96c4ef2-199c-44e3-978e-71a882e9c602","parentId":"a28439bd-eefc-4150-852d-bb181e87255a","name":"Managed context repositories — where the source of truth lives","type":"BUILDING","level":3,"x":18,"y":248,"width":300,"height":180,"color":"#0891b2","description":"Most enterprises already have the raw sources — code in Git, tickets in Jira, docs in Confluence or a wiki, runbooks in a runbook system, ADRs in a docs folder. The gap the platform must close is turning those raw source...","metadata":{},"createdAt":"2026-09-12T03:45:39.577632Z","updatedAt":"2026-09-12T05:07:44.090047Z"},{"id":"f6b68166-da8d-43a7-bc1a-fa65e183e580","parentId":"78fa7c8f-fe5c-409e-9080-609b77faab1c","name":"Measurement principles","type":"BUILDING","level":3,"x":18,"y":44,"width":300,"height":180,"color":"#8ba7c9","description":"Six principles that constrain what belongs in this framework 74-9db6-6f7a023ff81c","name":"Organization","type":"BUILDING","level":3,"x":18,"y":44,"width":300,"height":180,"color":"#8ba7c9","description":"References are numeric and stable: R1 through R283. Numbers are assigned once and never renumbered — an in-body citation of [R48] or [R255–R260] in any chapter always points to the same entry in Appendix P.","metadata":{},"createdAt":"2026-09-12T03:45:39.734358Z","updatedAt":"2026-09-12T05:07:44.094811Z"},{"id":"3e31f7e3-f551-433c-ba47-18897ceb419c","parentId":"1fbe4b83-6c1e-471d-ac04-9f197225e893","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#3b7dd8","description":"Product and platform teams must define task classes, ownership, approval boundaries, and evidence requirements. Engineering managers must protect time for reviewing agent outcomes and maintain clear accountability for se...","metadata":{},"createdAt":"2026-09-12T03:45:39.464314Z","updatedAt":"2026-09-12T05:07:44.095557Z"},{"id":"bc803d13-bf8a-4c0f-a5d9-b7d774a7dd5a","parentId":"919eb966-842d-4b01-a185-a32a2061569d","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#3b7dd8","description":"Teams need lightweight experiment templates, decision owners, evaluation criteria, time limits, and rules for discarding losing branches. Portfolio governance should fund learning rather than reward the volume of generat...","metadata":{},"createdAt":"2026-09-12T03:45:39.471460Z","updatedAt":"2026-09-12T05:07:44.095819Z"},{"id":"e444d1e3-e4c3-4e9b-8c8e-f6d23cd88705","parentId":"bd216b09-88a3-40f7-a152-8da2fe6bcd9d","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#3b7dd8","description":"Platform engineering, developer experience, and delivery leaders need shared flow metrics and service-level expectations for review, escalation, ownership routing, and decision aging.","metadata":{},"createdAt":"2026-09-12T03:45:39.480156Z","updatedAt":"2026-09-12T05:07:44.097314Z"},{"id":"81d028fc-4c13-4169-a50b-77ba7550592a","parentId":"a30ae549-9fcc-41f3-a333-0ccf3317e077","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#3b7dd8","description":"Teams must define decision ownership, escalation paths, interruption policies, and expected response windows. Product design must treat attention management and context quality as core developer experience concerns.","metadata":{},"createdAt":"2026-09-12T03:45:39.490319Z","updatedAt":"2026-09-12T05:07:44.098057Z"},{"id":"164ae15b-ec80-408b-9555-8e34cebf0fcf","parentId":"898a9b23-7a6f-42e8-a7ce-cf6e495e55bd","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#3b7dd8","description":"Code owners, platform teams, and security must agree on review policy, severity, suppression, escalation, and evaluation datasets. Senior expertise should focus on high-risk changes rather than reviewing everything.","metadata":{},"createdAt":"2026-09-12T03:45:39.499416Z","updatedAt":"2026-09-12T05:07:44.099014Z"},{"id":"c837bddc-6380-417b-a981-446ca9bda53c","parentId":"25f97342-02a3-4239-882c-e1d6f62e3878","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#3b7dd8","description":"Quality engineering, service teams, and platform owners must define acceptance traceability, mandatory suites, flake policy, contract ownership, synthetic-data rules, and approval for changed baselines.","metadata":{},"createdAt":"2026-09-12T03:45:39.507173Z","updatedAt":"2026-09-12T05:07:44.099318Z"},{"id":"ccacc32a-6ef0-4d12-b2b3-6782f375be88","parentId":"647136af-4dbd-4119-9ebb-3ec5946b4dde","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#3b7dd8","description":"SRE, service owners, platform engineering, security, release engineering, and incident management must jointly own service health models, SLOs, dependency and topology data, action catalogs, authority tiers, escalation, ...","metadata":{},"createdAt":"2026-09-12T03:45:39.518191Z","updatedAt":"2026-09-12T05:07:44.100057Z"},{"id":"3550e49a-a9c7-4d99-86bb-1c30182751f6","parentId":"6d2f9e94-4a10-4238-acf5-7dd337a52c92","name":"Organizational requirements","type":"BUILDING","level":3,"x":18,"y":248,"width":300,"height":180,"color":"#7c3aed","description":"The Autonomy Council owns the matrix. Every quarter it publishes the current tier map — which cell is at which autonomy tier, what evidence supported the last movement, and what will need to be true to move the next cell...","metadata":{},"createdAt":"2026-09-12T03:45:39.533791Z","updatedAt":"2026-09-12T05:07:44.100990Z"},{"id":"a5fdd6f6-b32e-4123-8304-06271a3e448c","parentId":"5dcf0b25-1696-461f-8907-fcb0c47a5c3d","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#0891b2","description":"Architecture, security, platform, service teams, and documentation owners must curate canonical guidance and resolve conflicts. A knowledge product owner should govern freshness, access, feedback, and retirement.","metadata":{},"createdAt":"2026-09-12T03:45:39.555108Z","updatedAt":"2026-09-12T05:07:44.101877Z"},{"id":"a584ef91-46ee-4e60-8575-71040331eaf2","parentId":"f6895ef1-54ef-4c5c-8abe-8c2e9ff700de","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#0891b2","description":"Capability owners need publication standards, versioning, support obligations, permission models, evaluation, and deprecation processes. Security and platform teams must jointly operate catalogs and gateway policy.","metadata":{},"createdAt":"2026-09-12T03:45:39.564399Z","updatedAt":"2026-09-12T05:07:44.102853Z"},{"id":"5304e63c-87f0-4dd5-813c-f47c26794428","parentId":"48dbeacf-3a4d-4195-87d1-4fa398faa285","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#0891b2","description":"Support channels need explicit ownership, escalation agreements, feedback loops, and incentives for experts to improve reusable guidance. Platform teams should own recurrence reduction, not only ticket closure.","metadata":{},"createdAt":"2026-09-12T03:45:39.573739Z","updatedAt":"2026-09-12T05:07:44.103364Z"},{"id":"bbeeafd2-d602-49e7-96b6-c361f2cc82ec","parentId":"ddae96b6-5aed-4b82-82c4-dbcfe6d9d7ca","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#c94040","description":"FinOps, platform, security, and engineering leadership need common cost attribution and exception policies. Engineers need guidance that explains trade-offs without treating spend alone as misuse.","metadata":{},"createdAt":"2026-09-12T03:45:39.592807Z","updatedAt":"2026-09-12T05:08:11.082174Z"},{"id":"c2ab2a4f-621a-479b-9b46-b06bb2ec2797","parentId":"a82c8cb1-ed62-46f1-adc9-a94467ea4164","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#c94040","description":"A small accountable team should coordinate trials while practitioners across disciplines contribute evidence. Leaders must fund experiments, recognize contributors, and retire practices that no longer work.","metadata":{},"createdAt":"2026-09-12T03:45:39.617732Z","updatedAt":"2026-09-12T05:09:44.945286Z"},{"id":"44faf691-53a1-43cb-a7b2-18af2e9e562a","parentId":"1ff8daab-000b-4f06-a243-6b150526ab8d","name":"Organizational requirements","type":"BUILDING","level":3,"x":666,"y":44,"width":300,"height":180,"color":"#c94040","description":"Security engineering must co-own policies, threat models, evaluation data, exception handling, incident response, and gateway controls with the developer platform. Service owners remain accountable for accepted risk.","metadata": for-agenti","metadata":{},"createdAt":"2026-09-12T03:45:39.760592Z"},{"id":"0da8cfd9-b9bc-4548-baf6-10e92746b82c","sourceId":"90bd24e3-fc8a-4c9d-8e45-4dfc98d0edd6","targetId":"001171f3-2acf-491d-9e16-29683a3503ef","kind":"references","label":"part-five-reference-operating-models","metadata":{},"createdAt":"2026-09-12T03:45:39.760931Z"},{"id":"872a9507-45e5-4a70-8246-ae32de5170db","sourceId":"90bd24e3-fc8a-4c9d-8e45-4dfc98d0edd6","targetId":"b890eba0-7535-4d96-bac8-9b71643543b2","kind":"references","label":"glossary","metadata":{},"createdAt":"2026-09-12T03:45:39.761228Z"},{"id":"17ea7367-9fb3-4389-8b85-581ea6cbefa8","sourceId":"90bd24e3-fc8a-4c9d-8e45-4dfc98d0edd6","targetId":"bf9af58b-665e-4439-9054-579204965149","kind":"references","label":"part-three-trust-economics-and-continuou","metadata":{},"createdAt":"2026-09-12T03:45:39.761543Z"},{"id":"58253955-c0d2-4d38-bdf3-aec92ce728bc","sourceId":"90bd24e3-fc8a-4c9d-8e45-4dfc98d0edd6","targetId":"0e0c4216-9d38-46c0-a3eb-ff45f1d31308","kind":"references","label":"part-one-engineer-as-orchestrator-and-th","metadata":{},"createdAt":"2026-09-12T03:45:39.761836Z"}]};
    
(() => {
  const $ = (id) => document.getElementById(id);
  const viewport = $('viewport');
  const world = $('world');
  const nodesEl = $('nodes');
  const edgesEl = $('edges');
  const panel = $('panel-content');
  const panelEmpty = $('panel-empty');
  const search = $('search');
  const crumb = $('crumb');
  const btnReset = $('reset');
  const btnUp = $('up');
  const btnPrint = $('print');
  const btnEdges = $('toggle-edges');
  const printPagesEl = $('print-pages');
  const modesEl = $('modes');
  const bodyEl = document.body;

  const byId = new Map(DATA.components.map(c => [c.id, c]));
  const childrenOf = new Map();
  for (const c of DATA.components) {
    if (!childrenOf.has(c.parentId || null)) childrenOf.set(c.parentId || null, []);
    childrenOf.get(c.parentId || null).push(c);
  }

  // Compute absolute (world) position of every node once.
  const abs = new Map();
  function computeAbs(root, parentX, parentY) {
    abs.set(root.id, { x: parentX + root.x, y: parentY + root.y });
    for (const child of (childrenOf.get(root.id) || [])) computeAbs(child, parentX + root.x, parentY + root.y);
  }
  for (const r of (childrenOf.get(null) || [])) computeAbs(r, 0, 0);

  const initialMode = (() => {
    const m = bodyEl.getAttribute('data-mode');
    if (m === 'blueprint' || m === 'wireframe' || m === 'city') return m;
    return 'city';
  })();

  const urlParams = (() => {
    try { return new URL(window.location.href).searchParams; }
    catch (_e) { return new URLSearchParams(); }
  })();

  const state = {
    scale: 0.5,
    tx: 100,
    ty: 100,
    focusRootId: null,
    selectedId: null,
    query: '',
    mode: initialMode,
    showEdges: urlParams.get('edges') !== 'off',
  };

  function applyMode(m) {
    state.mode = m;
    bodyEl.setAttribute('data-mode', m);
    modesEl.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('active', b.getAttribute('data-mode-btn') === m);
    });
    render();
  }

  function applyTransform() {
    world.style.transform = 'translate(' + state.tx + 'px, ' + state.ty + 'px) scale(' + state.scale + ')';
  }

  function ancestors(id) {
    const chain = [];
    let cur = byId.get(id);
    while (cur) { chain.unshift(cur); cur = cur.parentId ? byId.get(cur.parentId) : null; }
    return chain;
  }

  function visibleIds() {
    if (!state.focusRootId) return new Set(DATA.components.map(c => c.id));
    const s = new Set(); const q = [state.focusRootId];
    while (q.length) { const id = q.shift(); s.add(id); for (const ch of (childrenOf.get(id) || [])) q.push(ch.id); }
    return s;
  }

  function pickTextColor(bg) {
    if (!bg) return '#fff';
    const hex = bg.replace('#', '');
    const b = hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex;
    const r = parseInt(b.slice(0,2), 16), g = parseInt(b.slice(2,4), 16), bl = parseInt(b.slice(4,6), 16);
    const luma = 0.2126*r + 0.7152*g + 0.0722*bl;
    return luma > 160 ? '#0b1220' : '#fff';
  }

  function hexA(hex, a) {
    if (!hex) return 'rgba(51,65,85,' + a + ')';
    const h = hex.replace('#', '');
    const b = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
    const r = parseInt(b.slice(0,2), 16), g = parseInt(b.slice(2,4), 16), bl = parseInt(b.slice(4,6), 16);
    return 'rgba(' + r + ',' + g + ',' + bl + ',' + a + ')';
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render() {
    nodesEl.innerHTML = '';
    edgesEl.innerHTML = '';
    const visible = visibleIds();
    const sorted = DATA.components
      .filter(c => visible.has(c.id))
      .sort((a, b) => a.level - b.level);

    // Bounding box of visible world for SVG sizing
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const c of sorted) {
      const p = abs.get(c.id);
      const px = state.focusRootId === c.id ? 0 : p.x;
      const py = state.focusRootId === c.id ? 0 : p.y;
      if (px < minX) minX = px;
      if (py < minY) minY = py;
      if (px + c.width > maxX) maxX = px + c.width;
      if (py + c.height > maxY) maxY = py + c.height;
    }
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 100; maxY = 100; }
    edgesEl.style.width  = (maxX - minX + 200) + 'px';
    edgesEl.style.height = (maxY - minY + 200) + 'px';
    edgesEl.setAttribute('viewBox', minX + ' ' + minY + ' ' + (maxX - minX + 200) + ' ' + (maxY - minY + 200));
    edgesEl.style.left = '0px'; edgesEl.style.top = '0px';

    // Recompute abs positions when we focus on a subtree, so the focus root is at origin.
    const focusOffset = state.focusRootId
      ? (() => { const a = abs.get(state.focusRootId); return { x: a.x, y: a.y }; })()
      : { x: 0, y: 0 };

    const positions = new Map();
    for (const c of sorted) {
      const a = abs.get(c.id);
      positions.set(c.id, { x: a.x - focusOffset.x, y: a.y - focusOffset.y });
    }

    const q = state.query.trim().toLowerCase();
    const matches = (c) => !q ||
      (c.name || '').toLowerCase().includes(q) ||
      (c.description || '').toLowerCase().includes(q) ||
      (c.notes || '').toLowerCase().includes(q) ||
      JSON.stringify(c.metadata || {}).toLowerCase().includes(q);

    // A node is highlighted if it (or any descendant) matches.
    const highlight = new Set();
    if (q) {
      for (const c of DATA.components) {
        if (matches(c)) {
          highlight.add(c.id);
          let p = c.parentId;
          while (p) { highlight.add(p); const pc = byId.get(p); p = pc && pc.parentId; }
        }
      }
    }

    for (const c of sorted) {
      const p = positions.get(c.id);
      const el = document.createElement('div');
      el.dataset.id = c.id;
      el.className = 'node level-' + c.level +
        (state.selectedId === c.id ? ' selected' : '') +
        (q && !highlight.has(c.id) ? ' dim' : '');
      el.style.left = p.x + 'px';
      el.style.top  = p.y + 'px';
      el.style.width  = c.width + 'px';
      el.style.height = c.height + 'px';
      // In blueprint/wireframe the node fill is set by the mode's CSS (flat, no
      // colour). Only city mode paints the container in its role colour.
      if (state.mode === 'city') {
        el.style.background = 'linear-gradient(180deg, ' + hexA(c.color, 0.25) + ', ' + hexA(c.color, 0.55) + ')';
      } else {
        el.style.background = '';
      }
      // Deeper levels paint on top so smaller inner nodes are hit-testable and
      // visually cover their parents. (In the live React Flow app, nodes are
      // actually nested in the DOM so this comes for free.)
      el.style.zIndex = String(c.level + 1);

      const hasChildren = childrenOf.has(c.id) && childrenOf.get(c.id).length > 0;
      const tags = (c.metadata && Array.isArray(c.metadata.tags)) ? c.metadata.tags.slice(0, 6) : [];
      const stars = c.metadata && typeof c.metadata.stars === 'number' ? c.metadata.stars : null;
      const language = c.metadata && c.metadata.language;
      const url = c.metadata && c.metadata.url;

      const bodyBits = [];
      const showBody = !hasChildren && c.width >= 200 && c.height >= 100;
      const showTags = !hasChildren && c.width >= 240 && c.height >= 140 && tags.length;
      const showLang = !hasChildren && c.width >= 260 && c.height >= 170 && language;
      const showLink = !hasChildren && c.width >= 220 && c.height >= 80 && url;

      if (showBody && c.description) {
        bodyBits.push('<div class="desc">' + esc(c.description) + '</div>');
      }
      if (showTags) {
        bodyBits.push('<div class="chips">' + tags.map(t => '<span class="chip">' + esc(t) + '</span>').join('') + '</div>');
      }
      if (showLang) {
        bodyBits.push('<div class="chips"><span class="chip">' + esc(language) + '</span></div>');
      }
      if (showLink) {
        const short = String(url).replace(/^https?:\/\/(www\.)?/, '');
        bodyBits.push('<a class="repo-link" href="' + esc(url) + '" target="_blank" rel="noreferrer" onclick="event.stopPropagation();">' + esc(short) + '</a>');
      }

      const starsBadge = (stars != null && c.level >= 3 && c.width >= 260)
        ? '<span class="badge">★ ' + stars + '</span>' : '';

      el.innerHTML =
        '<div class="head">' +
          '<span class="title">' + esc(c.name) + '</span>' +
          starsBadge +
          (c.type ? '<span class="badge">' + esc(c.type) + '</span>' : '') +
        '</div>' +
        (bodyBits.length ? '<div class="body">' + bodyBits.join('') + '</div>' : '');

      el.addEventListener('click', (e) => { e.stopPropagation(); selectNode(c.id); });
      el.addEventListener('dblclick', (e) => { e.stopPropagation(); focusOn(c.id); });
      nodesEl.appendChild(el);
    }

    // Edges — only within the visible set, and only when the user hasn't
    // toggled them off in the header.
    if (!state.showEdges) return updateCrumb();
    for (const conn of DATA.connections) {
      if (!visible.has(conn.sourceId) || !visible.has(conn.targetId)) continue;
      const s = byId.get(conn.sourceId), t = byId.get(conn.targetId);
      if (!s || !t) continue;
      const sp = positions.get(s.id), tp = positions.get(t.id);
      if (!sp || !tp) continue;
      const x1 = sp.x + s.width;
      const y1 = sp.y + s.height / 2;
      const x2 = tp.x;
      const y2 = tp.y + t.height / 2;
      // Bezier curve
      const dx = Math.abs(x2 - x1);
      const midx1 = x1 + dx * 0.4;
      const midx2 = x2 - dx * 0.4;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('data-source', conn.sourceId);
      g.setAttribute('data-target', conn.targetId);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + midx1 + ' ' + y1 + ', ' + midx2 + ' ' + y2 + ', ' + x2 + ' ' + y2);
      const edgeColor =
        state.mode === 'blueprint' ? '#cffafe' :
        state.mode === 'wireframe' ? '#111827' :
        (conn.kind === 'depends_on' ? '#a78bfa' : '#64748b');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', edgeColor);
      path.setAttribute('stroke-width', state.mode === 'wireframe' ? '1.25' : '1.5');
      if (conn.kind === 'depends_on') path.setAttribute('stroke-dasharray', '4 4');
      path.setAttribute('opacity', state.mode === 'city' ? '0.65' : '0.9');
      g.appendChild(path);

      if (conn.label) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', ((x1 + x2) / 2).toString());
        text.setAttribute('y', ((y1 + y2) / 2 - 4).toString());
        text.setAttribute('font-size', '10');
        text.setAttribute('fill',
          state.mode === 'blueprint' ? '#cffafe' :
          state.mode === 'wireframe' ? '#111827' : '#94a3b8');
        text.setAttribute('text-anchor', 'middle');
        text.textContent = conn.label;
        g.appendChild(text);
      }
      edgesEl.appendChild(g);
    }

    updateCrumb();
  }

  function siblingsOf(id) {
    const c = byId.get(id);
    if (!c) return [];
    const parentId = c.parentId || null;
    const sibs = (childrenOf.get(parentId) || []).slice().sort((a, b) => {
      const dy = (a.y || 0) - (b.y || 0);
      if (Math.abs(dy) > 20) return dy;
      return (a.x || 0) - (b.x || 0);
    });
    return sibs;
  }

  function updateCrumb() {
    if (!state.focusRootId) { crumb.style.display = 'none'; return; }
    const chain = ancestors(state.focusRootId);
    const sibs = siblingsOf(state.focusRootId);
    const idx = sibs.findIndex(s => s.id === state.focusRootId);
    const prev = idx > 0 ? sibs[idx - 1] : null;
    const next = idx >= 0 && idx < sibs.length - 1 ? sibs[idx + 1] : null;
    crumb.style.display = 'block';
    crumb.innerHTML =
      '<span class="up">↑ Up</span>' +
      (sibs.length > 1
        ? '<span class="sib-prev" title="Previous sibling (← arrow)"' + (prev ? '' : ' data-off="1"') + '>← Prev</span>' +
          '<span class="sib-idx">' + (idx + 1) + ' / ' + sibs.length + '</span>' +
          '<span class="sib-next" title="Next sibling (→ arrow)"' + (next ? '' : ' data-off="1"') + '>Next →</span>'
        : '') +
      ' Viewing: ' +
      chain.map(c => '<span>' + esc(c.name) + '</span>').join(' <span style="color:#475569">›</span> ');
    crumb.querySelector('.up').onclick = () => focusOn(chain[chain.length - 2]?.id ?? null);
    const p = crumb.querySelector('.sib-prev');
    const n = crumb.querySelector('.sib-next');
    if (p && prev) p.onclick = () => focusOn(prev.id);
    if (n && next) n.onclick = () => focusOn(next.id);
  }

  // Arrow keys page through siblings when focused. Ignore when typing.
  window.addEventListener('keydown', (e) => {
    if (!state.focusRootId) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    const sibs = siblingsOf(state.focusRootId);
    const idx = sibs.findIndex(s => s.id === state.focusRootId);
    if (e.key === 'ArrowLeft' && idx > 0) {
      e.preventDefault();
      focusOn(sibs[idx - 1].id);
    } else if (e.key === 'ArrowRight' && idx >= 0 && idx < sibs.length - 1) {
      e.preventDefault();
      focusOn(sibs[idx + 1].id);
    }
  });

  function selectNode(id) {
    state.selectedId = id;
    const c = byId.get(id);
    if (!c) return;
    panelEmpty.hidden = true;
    panel.hidden = false;

    const path = ancestors(id).map(a => esc(a.name)).join(' › ');
    const tags = (c.metadata && Array.isArray(c.metadata.tags)) ? c.metadata.tags : [];
    const url = c.metadata && c.metadata.url;
    const lang = c.metadata && c.metadata.language;
    const stars = c.metadata && c.metadata.stars;

    let html = '<h2>' +
      '<span style="width:12px;height:12px;border-radius:3px;background:' + esc(c.color || '#334155') + ';display:inline-block"></span>' +
      esc(c.name) + '<span class="badge">' + esc(c.type || ('L' + c.level)) + '</span></h2>' +
      '<div class="path">' + path + '</div>';

    if (c.description) html += '<div class="row"><div class="label">Description</div><div class="value">' + esc(c.description) + '</div></div>';
    if (c.notes)       html += '<div class="row"><div class="label">Notes</div><div class="notes">' + esc(c.notes) + '</div></div>';
    if (tags.length)   html += '<div class="row"><div class="label">Tags</div><div class="chips">' + tags.map(t => '<span class="chip">' + esc(t) + '</span>').join('') + '</div></div>';
    if (lang || stars != null || url) {
      html += '<div class="row">';
      if (lang)         html += '<div class="label">Language</div><div class="value">' + esc(lang) + '</div>';
      if (stars != null) html += '<div class="label" style="margin-top:6px">Stars</div><div class="value">★ ' + stars + '</div>';
      if (url)          html += '<div class="label" style="margin-top:6px">Repository</div><div class="value"><a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + esc(url) + '</a></div>';
      html += '</div>';
    }
    html += '<div class="row"><div class="label">Metadata</div><pre>' + esc(JSON.stringify(c.metadata || {}, null, 2)) + '</pre></div>';

    panel.innerHTML = html;
    // Update the .selected class in place — do NOT re-render the whole DOM here,
    // otherwise the click target vanishes and dblclick can never fire.
    nodesEl.querySelectorAll('.node.selected').forEach((n) => n.classList.remove('selected'));
    const sel = nodesEl.querySelector('.node[data-id="' + id + '"]');
    if (sel) sel.classList.add('selected');
  }

  function focusOn(id) {
    state.focusRootId = id;
    state.selectedId = id;
    fitToVisible();
    render();
    if (id) selectNode(id); else { panel.hidden = true; panelEmpty.hidden = false; }
  }

  function fitToVisible() {
    const visible = visibleIds();
    if (!visible.size) return;
    const focusOffset = state.focusRootId
      ? abs.get(state.focusRootId)
      : { x: 0, y: 0 };
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const id of visible) {
      const c = byId.get(id);
      const a = abs.get(id);
      const x = a.x - focusOffset.x, y = a.y - focusOffset.y;
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x + c.width > maxX) maxX = x + c.width;
      if (y + c.height > maxY) maxY = y + c.height;
    }
    const w = maxX - minX, h = maxY - minY;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const pad = 40;
    const s = Math.min((vw - pad * 2) / w, (vh - pad * 2) / h, 2.0);
    state.scale = s;
    state.tx = pad - minX * s + (vw - pad * 2 - w * s) / 2;
    state.ty = pad - minY * s + (vh - pad * 2 - h * s) / 2;
    applyTransform();
  }

  // Pan
  let dragging = false, dragStart = null;
  viewport.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    dragStart = { x: e.clientX - state.tx, y: e.clientY - state.ty };
    viewport.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    state.tx = e.clientX - dragStart.x;
    state.ty = e.clientY - dragStart.y;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    viewport.classList.remove('dragging');
  });

  // Zoom
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 0.87;
    const newScale = Math.max(0.03, Math.min(5, state.scale * factor));
    const k = newScale / state.scale;
    state.tx = cx - (cx - state.tx) * k;
    state.ty = cy - (cy - state.ty) * k;
    state.scale = newScale;
    applyTransform();
  }, { passive: false });

  // Deselect on background click
  viewport.addEventListener('click', (e) => {
    if (e.target === viewport || e.target === world || e.target === nodesEl) {
      state.selectedId = null;
      panel.hidden = true;
      panelEmpty.hidden = false;
      render();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (bodyEl.classList.contains('outlining')) {
        teardownOutline();
      } else if (state.focusRootId) {
        const parent = byId.get(state.focusRootId).parentId;
        focusOn(parent || null);
      } else if (state.selectedId) {
        state.selectedId = null;
        panel.hidden = true;
        panelEmpty.hidden = false;
        render();
      }
    }
  });

  search.addEventListener('input', () => { state.query = search.value; render(); });
  btnReset.onclick = () => { state.focusRootId = null; state.selectedId = null; fitToVisible(); render(); panel.hidden = true; panelEmpty.hidden = false; };
  btnUp.onclick = () => {
    if (!state.focusRootId) return;
    const parent = byId.get(state.focusRootId).parentId;
    focusOn(parent || null);
  };
  function computeVisibleBounds() {
    const visible = visibleIds();
    const focusOffset = state.focusRootId ? abs.get(state.focusRootId) : { x: 0, y: 0 };
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const id of visible) {
      const c = byId.get(id);
      const a = abs.get(id);
      const x = a.x - focusOffset.x, y = a.y - focusOffset.y;
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x + c.width > maxX) maxX = x + c.width;
      if (y + c.height > maxY) maxY = y + c.height;
    }
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 1; maxY = 1; }
    return { minX, minY, maxX, maxY, worldW: maxX - minX, worldH: maxY - minY };
  }

  // Tile print — split the currently-visible world across an N-wide grid of
  // letter-landscape sheets, each sized to the printable region (263 x 199 mm
  // after 8 mm safety margins). Rows are auto-computed to preserve aspect.
  function buildTiles(pagesWide) {
    const { minX, minY, worldW, worldH } = computeVisibleBounds();
    if (worldW <= 0 || worldH <= 0) return false;
    const tileMmW = 263, tileMmH = 199;
    const mmPerPx = (tileMmW * pagesWide) / worldW;
    const pagesTall = Math.max(1, Math.ceil((worldH * mmPerPx) / tileMmH));
    // Browsers assume 96 CSS px per inch; use that to convert our mm-per-px
    // ratio into a unitless CSS scale factor for the transform.
    const CSS_PX_PER_MM = 96 / 25.4;
    const scale = mmPerPx * CSS_PX_PER_MM;

    let sheet = document.getElementById('print-sheet');
    if (sheet) sheet.remove();
    sheet = document.createElement('div');
    sheet.id = 'print-sheet';
    bodyEl.appendChild(sheet);

    const totalTiles = pagesWide * pagesTall;
    let idx = 0;
    for (let row = 0; row < pagesTall; row++) {
      for (let col = 0; col < pagesWide; col++) {
        idx++;
        const tile = document.createElement('div');
        tile.className = 'print-tile';

        const originXpx = minX + col * (tileMmW / mmPerPx);
        const originYpx = minY + row * (tileMmH / mmPerPx);

        const worldClone = world.cloneNode(true);
        worldClone.style.transformOrigin = '0 0';
        worldClone.style.transform =
          'translate(' + (-originXpx * scale) + 'px, ' + (-originYpx * scale) + 'px) scale(' + scale + ')';
        // Duplicated IDs inside clones would collide with the interactive DOM
        // (e.g. document.getElementById('edges') would find the wrong one).
        worldClone.removeAttribute('id');
        worldClone.querySelectorAll('[id]').forEach((el) => el.removeAttribute('id'));
        tile.appendChild(worldClone);

        const label = document.createElement('div');
        label.className = 'tile-label';
        label.textContent = idx + '/' + totalTiles + '  ·  R' + (row + 1) + 'C' + (col + 1);
        tile.appendChild(label);

        sheet.appendChild(tile);
      }
    }
    return true;
  }

  // One tile per subtree — used by both "N wide" tile print (whole visible
  // world as one bounds) and "L1/L2 per page" print (one subtree per tile).
  // Non-subtree nodes and edges in the world clone are hidden so each tile
  // shows only the component and its descendants.
  function buildPerLevel(level) {
    const visible = visibleIds();
    // Preserve reading order: top→bottom, then left→right (matches sibling nav).
    const targets = DATA.components
      .filter(c => visible.has(c.id) && c.level === level)
      .slice()
      .sort((a, b) => {
        const dy = (a.y || 0) - (b.y || 0);
        if (Math.abs(dy) > 20) return dy;
        return (a.x || 0) - (b.x || 0);
      });
    if (!targets.length) return false;

    const tileMmW = 263, tileMmH = 199;
    const headerMmH = 12;   // reserved for per-page header at top
    const contentMmH = tileMmH - headerMmH;
    const CSS_PX_PER_MM = 96 / 25.4;

    let sheet = document.getElementById('print-sheet');
    if (sheet) sheet.remove();
    sheet = document.createElement('div');
    sheet.id = 'print-sheet';
    bodyEl.appendChild(sheet);

    targets.forEach((target, idx) => {
      // Collect the subtree ids for this target.
      const subtree = new Set();
      const q = [target.id];
      while (q.length) {
        const id = q.shift();
        subtree.add(id);
        for (const child of (childrenOf.get(id) || [])) q.push(child.id);
      }

      // Bounds from DESCENDANTS only. The L1/L2 world box tends to be much
      // wider than its actual content, so using the container's bounds wastes
      // half the sheet. Falling back to the container's own bounds only when
      // there are no descendants.
      const focusOffset = state.focusRootId ? abs.get(state.focusRootId) : { x: 0, y: 0 };
      const boundsIds = subtree.size > 1
        ? [...subtree].filter(id => id !== target.id)
        : [target.id];
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const id of boundsIds) {
        const c = byId.get(id);
        const a = abs.get(id);
        const x = a.x - focusOffset.x, y = a.y - focusOffset.y;
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x + c.width > maxX) maxX = x + c.width;
        if (y + c.height > maxY) maxY = y + c.height;
      }
      const w = maxX - minX, h = maxY - minY;
      if (w <= 0 || h <= 0) return;

      // Fit-to-page: pick the smaller scale so the subtree fits both dims.
      const mmPerPx = Math.min(tileMmW / w, contentMmH / h);
      const scale = mmPerPx * CSS_PX_PER_MM;
      const scaledWmm = w * mmPerPx;
      const scaledHmm = h * mmPerPx;
      const marginXmm = (tileMmW - scaledWmm) / 2;
      const marginYmm = headerMmH + (contentMmH - scaledHmm) / 2;

      const tile = document.createElement('div');
      tile.className = 'print-tile per-page';

      const header = document.createElement('div');
      header.className = 'per-page-header';
      header.innerHTML =
        '<div class="pp-title">' +
          '<span class="pp-badge">' + esc(target.type || 'L' + target.level) + '</span> ' +
          esc(target.name) +
        '</div>' +
        '<div class="pp-meta">' +
          '<span class="pp-path">' + esc(pathOf(target.id)) + '</span>' +
          '<span class="pp-idx">' + (idx + 1) + ' / ' + targets.length + '</span>' +
        '</div>';
      tile.appendChild(header);

      const worldClone = world.cloneNode(true);
      // Hide non-subtree nodes and edges. Also hide the target's own frame when
      // it has descendants — the header at the top of the sheet already shows
      // its name/type, and its world box is usually much larger than the
      // descendants' actual footprint, wasting page area.
      const hideTarget = subtree.size > 1;
      worldClone.querySelectorAll('.node').forEach((n) => {
        const id = n.dataset.id;
        if (!subtree.has(id) || (hideTarget && id === target.id)) n.style.display = 'none';
      });
      worldClone.querySelectorAll('svg g[data-source]').forEach((g) => {
        const s = g.getAttribute('data-source'), t = g.getAttribute('data-target');
        if (!subtree.has(s) || !subtree.has(t)) g.remove();
      });

      worldClone.style.transformOrigin = '0 0';
      worldClone.style.transform =
        'translate(' + (marginXmm * CSS_PX_PER_MM - minX * scale) + 'px, ' +
        (marginYmm * CSS_PX_PER_MM - minY * scale) + 'px) scale(' + scale + ')';
      worldClone.removeAttribute('id');
      worldClone.querySelectorAll('[id]').forEach((el) => el.removeAttribute('id'));
      tile.appendChild(worldClone);

      sheet.appendChild(tile);
    });

    return true;
  }

  function teardownTiles() {
    const sheet = document.getElementById('print-sheet');
    if (sheet) sheet.remove();
    bodyEl.classList.remove('tiling', 'tiling-blueprint');
  }
  function teardownOutline() {
    const doc = document.getElementById('print-outline');
    if (doc) doc.remove();
    bodyEl.classList.remove('outlining');
  }
  // Do NOT tear down on afterprint — Chrome fires afterprint whenever the
  // dialog closes (including cancel), which used to strip the tile sheet
  // between the auto-print and the user hitting Cmd+P to re-print. Now we
  // clear stale state at the START of each Print click instead. On screen,
  // #print-sheet / #print-outline are hidden by their own display rules.

  function pathOf(id) {
    const chain = [];
    let cur = byId.get(id);
    while (cur) { chain.unshift(cur.name); cur = cur.parentId ? byId.get(cur.parentId) : null; }
    return chain.join(' › ');
  }

  // Outline print — depth-first list of every component in (or below) the
  // current focus, each one rendered as an information block. No layout — the
  // point is to fit the *content* on paper, not the map's geometry.
  function buildOutline(density = 'regular') {
    // Index connections by endpoint once so each entry can lookup Uses/Used-by
    // in constant time.
    const outEdges = new Map(), inEdges = new Map();
    for (const e of DATA.connections) {
      if (!outEdges.has(e.sourceId)) outEdges.set(e.sourceId, []);
      outEdges.get(e.sourceId).push(e);
      if (!inEdges.has(e.targetId)) inEdges.set(e.targetId, []);
      inEdges.get(e.targetId).push(e);
    }

    const visible = visibleIds();
    const sections = [];
    const walk = (id, depth) => {
      if (!visible.has(id)) return;
      const c = byId.get(id);
      sections.push({ c, depth });
      const kids = (childrenOf.get(id) || []).slice().sort((a, b) => {
        // Reading order: top-to-bottom, then left-to-right.
        const dy = (a.y || 0) - (b.y || 0);
        if (Math.abs(dy) > 20) return dy;
        return (a.x || 0) - (b.x || 0);
      });
      for (const child of kids) walk(child.id, depth + 1);
    };
    const startIds = state.focusRootId
      ? [state.focusRootId]
      : (childrenOf.get(null) || []).map(c => c.id);
    for (const id of startIds) walk(id, 0);

    if (!sections.length) return false;

    let root = document.getElementById('print-outline');
    if (root) root.remove();
    root = document.createElement('div');
    root.id = 'print-outline';
    root.classList.add('density-' + density);

    // Floating toolbar so the user can Print / change density / return to map
    // without having to re-navigate. Screen-only — hidden by @media print.
    const toolbar = document.createElement('div');
    toolbar.className = 'outline-toolbar';
    toolbar.innerHTML =
      '<button data-outline-close title="Return to the map (Esc)">← Back to map</button>' +
      '<label>Density</label>' +
      '<select data-outline-density>' +
        '<option value="tree"' + (density === 'tree' ? ' selected' : '') + '>Tree</option>' +
        '<option value="compact"' + (density === 'compact' ? ' selected' : '') + '>Compact</option>' +
        '<option value="regular"' + (density === 'regular' ? ' selected' : '') + '>Regular</option>' +
        '<option value="spacious"' + (density === 'spacious' ? ' selected' : '') + '>Spacious</option>' +
      '</select>' +
      '<button class="primary" data-outline-print title="Open the browser print dialog (Cmd/Ctrl+P)">Print</button>';
    root.appendChild(toolbar);
    toolbar.querySelector('[data-outline-close]').onclick = () => teardownOutline();
    toolbar.querySelector('[data-outline-print]').onclick = () => window.print();
    toolbar.querySelector('[data-outline-density]').onchange = (e) => {
      // Re-render at the newly-selected density and stay in outline view.
      const d = e.target.value;
      teardownOutline();
      if (buildOutline(d)) bodyEl.classList.add('outlining');
    };

    // Field visibility by density. Tree is a single-column indented hierarchy
    // with descriptions but no type badge / path / facts / connections — reads
    // like an annotated outline. Compact is an index — name + type only.
    // Regular keeps everything at 2 columns. Spacious uses one column with
    // larger type.
    const isTree     = density === 'tree';
    const showPath   = !isTree && density !== 'compact';
    const showDesc   = isTree || (density !== 'compact');
    const showNotes  = !isTree && density !== 'compact';
    const showFacts  = !isTree && density !== 'compact';
    const showRepo   = !isTree && density !== 'compact';
    const showConns  = !isTree && density !== 'compact';

    const rootName = state.focusRootId
      ? byId.get(state.focusRootId).name
      : (sections.find(s => s.c.level === 0)?.c.name || 'CityMap');

    const cover = document.createElement('section');
    cover.className = 'outline-cover';
    const genAt = document.querySelector('.brand-sub')?.textContent?.split(' · ').pop() || '';
    cover.innerHTML =
      '<h1>' + esc(rootName) + '</h1>' +
      '<div class="cover-sub">Component outline · ' + sections.length + ' items · ' + DATA.connections.length + ' connections</div>' +
      (genAt ? '<div class="cover-gen">' + esc(genAt) + '</div>' : '');
    root.appendChild(cover);

    // For the tree density we skip city-block grouping and put every entry
    // (including L0) in a single flat multicol body so the indent structure
    // is uninterrupted.
    let treeBody = null;
    if (isTree) {
      treeBody = document.createElement('div');
      treeBody.className = 'outline-body';
      root.appendChild(treeBody);
    }

    // Group by top-level (city) so each L0 gets a wide header and its own
    // multicol body for descendants. Avoids the column-span: all mid-flow
    // quirks that leave pages half-empty on some print engines.
    let currentCity = null;
    let currentBody = null;
    for (const s of sections) {
      const c = s.c;
      const el = document.createElement('article');
      el.className = 'outline-entry level-' + Math.max(0, Math.min(4, c.level));
      if (isTree) el.style.paddingLeft = (s.depth * 5) + 'mm';

      // Start a new city block whenever we hit an L0 (regular/compact/spacious).
      if (!isTree) {
        if (c.level === 0) {
          currentCity = document.createElement('section');
          currentCity.className = 'city-block';
          root.appendChild(currentCity);
          currentBody = null;
        } else if (!currentBody) {
          currentBody = document.createElement('div');
          currentBody.className = 'outline-body';
          (currentCity || root).appendChild(currentBody);
        }
      }

      const tags = (c.metadata && Array.isArray(c.metadata.tags)) ? c.metadata.tags : [];
      const url = c.metadata && c.metadata.url;
      const lang = c.metadata && c.metadata.language;
      const stars = c.metadata && c.metadata.stars;
      const license = c.metadata && c.metadata.license;
      const outs = outEdges.get(c.id) || [];
      const ins = inEdges.get(c.id) || [];

      const facts = [];
      if (lang) facts.push('<strong>Language:</strong> ' + esc(lang));
      if (stars != null) facts.push('★ ' + stars);
      if (license) facts.push(esc(license));
      if (tags.length) facts.push('<strong>Tags:</strong> ' + tags.map(esc).join(', '));

      let html = '';
      html += '<header>' +
        '<span class="dot" style="background:' + esc(c.color || '#334155') + '"></span>' +
        '<span class="entry-title">' + esc(c.name) + '</span>' +
        '<span class="entry-type">' + esc(c.type || 'L' + c.level) + '</span>' +
      '</header>';
      if (showPath && c.level > 0) {
        const p = pathOf(c.id);
        if (p && p !== c.name) html += '<div class="entry-path">' + esc(p) + '</div>';
      }
      if (showDesc && c.description) html += '<div class="entry-desc">' + esc(c.description) + '</div>';
      if (showNotes && c.notes) html += '<div class="entry-notes">' + esc(c.notes) + '</div>';
      if (showFacts && facts.length) html += '<div class="entry-facts">' + facts.join(' · ') + '</div>';
      if (showRepo && url) html += '<div class="entry-facts"><strong>Repo:</strong> <a href="' + esc(url) + '">' + esc(String(url).replace(/^https?:\/\/(www\.)?/, '')) + '</a></div>';
      if (showConns && outs.length) {
        html += '<div class="entry-conns"><strong>Uses</strong>' + outs.map(e => {
          const t = byId.get(e.targetId);
          const label = e.kind && e.kind !== 'uses' ? ' <em>(' + esc(e.kind) + ')</em>' : '';
          const lab2 = e.label ? ' — ' + esc(e.label) : '';
          return ' → ' + esc(t ? t.name : e.targetId) + label + lab2;
        }).join(';') + '</div>';
      }
      if (showConns && ins.length) {
        html += '<div class="entry-conns"><strong>Used by</strong>' + ins.map(e => {
          const src = byId.get(e.sourceId);
          const label = e.kind && e.kind !== 'uses' ? ' <em>(' + esc(e.kind) + ')</em>' : '';
          const lab2 = e.label ? ' — ' + esc(e.label) : '';
          return ' ← ' + esc(src ? src.name : e.sourceId) + label + lab2;
        }).join(';') + '</div>';
      }

      el.innerHTML = html;
      if (isTree) {
        treeBody.appendChild(el);
      } else if (c.level === 0) {
        // L0 lives on the city block directly; deeper levels flow in the body.
        currentCity.appendChild(el);
      } else {
        currentBody.appendChild(el);
      }
    }
    bodyEl.appendChild(root);
    return true;
  }

  btnPrint.onclick = () => {
    // Start every print with a clean slate. If the user cancelled a previous
    // print and hit Print again, the old #print-sheet / #print-outline would
    // otherwise linger and print the wrong content.
    teardownTiles();
    teardownOutline();
    const v = printPagesEl ? printPagesEl.value : 'fit';
    // Outline — a text-first view. Build and switch the tab into outline mode
    // (visible on screen); the browser print dialog opens too so one click
    // both previews and prints. The outline stays visible after the dialog
    // closes so the user can review, change density, and re-print.
    const outlineDensity =
      v === 'outline-compact' ? 'compact' :
      v === 'outline-spacious' ? 'spacious' :
      v === 'outline-tree' ? 'tree' :
      v === 'outline' ? 'regular' : null;
    if (outlineDensity) {
      if (!buildOutline(outlineDensity)) { window.print(); return; }
      bodyEl.classList.add('outlining');
      window.scrollTo(0, 0);
      setTimeout(() => window.print(), 120);
      return;
    }
    // One L1/L2 per page — each target and its subtree, fit to letter landscape.
    if (v === 'l1-per-page' || v === 'l2-per-page') {
      const level = v === 'l1-per-page' ? 1 : 2;
      if (!buildPerLevel(level)) { window.print(); return; }
      bodyEl.classList.add('tiling');
      if (state.mode === 'blueprint') bodyEl.classList.add('tiling-blueprint');
      setTimeout(() => window.print(), 60);
      return;
    }
    const n = parseInt(v, 10);
    if (!v || v === 'fit' || !Number.isFinite(n) || n < 1) {
      window.print();
      return;
    }
    if (!buildTiles(n)) {
      window.print();
      return;
    }
    bodyEl.classList.add('tiling');
    if (state.mode === 'blueprint') bodyEl.classList.add('tiling-blueprint');
    setTimeout(() => window.print(), 60);
  };
  function refreshEdgeButton() {
    btnEdges.textContent = state.showEdges ? 'Edges: on' : 'Edges: off';
    btnEdges.setAttribute('aria-pressed', String(state.showEdges));
    btnEdges.classList.toggle('off', !state.showEdges);
  }
  btnEdges.onclick = () => { state.showEdges = !state.showEdges; refreshEdgeButton(); render(); };
  refreshEdgeButton();
  modesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode-btn]');
    if (!btn) return;
    applyMode(btn.getAttribute('data-mode-btn'));
  });

  // Honour ?mode= override on the URL, else fall back to the body's data-mode.
  const urlMode = (() => {
    try { return new URL(window.location.href).searchParams.get('mode'); }
    catch (_e) { return null; }
  })();
  applyMode(urlMode === 'blueprint' || urlMode === 'wireframe' || urlMode === 'city' ? urlMode : initialMode);

  // Honour ?tile=N — preselect the tile-print pages dropdown. Accepts numeric
  // values (1/2/3/...) plus the named values "fit", "outline",
  // "outline-compact", and "outline-spacious".
  const urlTile = urlParams.get('tile');
  if (urlTile && printPagesEl) {
    const named = new Set(['fit', 'outline', 'outline-tree', 'outline-compact', 'outline-spacious', 'l1-per-page', 'l2-per-page']);
    const wanted = named.has(urlTile) ? urlTile : String(parseInt(urlTile, 10) || '');
    if ([...printPagesEl.options].some((o) => o.value === wanted)) {
      printPagesEl.value = wanted;
    }
  }

  // Honour ?print=1 — the React app opens tile/outline print in a new tab and
  // uses this to auto-trigger the Print button, so the user gets one click end
  // to end instead of "new tab opens, then click Print again".
  if (urlParams.get('print') === '1') {
    setTimeout(() => btnPrint.click(), 250);
  }

  // Initial render
  fitToVisible();
  render();
})();

  </script>
</body>
</html>
